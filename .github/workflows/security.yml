name: Security Audit

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  security-scan:
    name: Flutter Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Security & Quality Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true